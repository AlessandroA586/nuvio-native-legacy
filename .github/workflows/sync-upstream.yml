name: Sync with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Master from Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote and Fetch
        run: |
          git remote add upstream https://github.com/iqui27/nuvio-native-legacy.git || true
          git fetch upstream master

      - name: Merge Upstream Changes
        run: |
          git merge upstream/master -m "chore: sync upstream nuvio-native-legacy changes" --no-edit || {
            echo "Conflict detected, aborting auto-merge"
            git merge --abort
            exit 1
          }
          git push origin master
