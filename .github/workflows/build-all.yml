name: Build and Release Nuvio Legacy

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'deploy/**'
      - 'android/**'
      - 'tizen-tpk/**'
      - 'tools/**'
      - '.github/workflows/build-all.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install System Utilities (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android NDK & SDK Components
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup local.properties and Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          cat <<EOF > local.properties
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
          TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login
          TMDB_API_KEY=01926d2187b6a5d861eefc750e9df3e3
          TRAKT_CLIENT_ID=5783db7c46a5b22f072d4b224f9bd7dc2cbaba66dbe3515d1feb59e3ca72394c
          TRAKT_CLIENT_SECRET=bf6e7561dafee902f5a2a67d2b31feac1563632f331f3958c978aff6389ea384
          SIMKL_CLIENT_ID=dc20e0db975583b15096267cee79cd23b1f56d4bd301ce3c51e4a96a49c834a6
          SIMKL_APP_NAME=nuvio
          NUVIO_REC_URL=https://nuvio-recomendacoes.henriquef29.workers.dev
          EOF

          mkdir -p "$HOME/.nuvio-android"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.nuvio-android/release.jks"

      - name: Build Native Dependencies
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash tools/android/deps.sh arm64-v8a armeabi-v7a

      - name: Build Android TV Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export NUVIO_KEYSTORE="$HOME/.nuvio-android/release.jks"
          export NUVIO_KEYSTORE_PASS="$RELEASE_STORE_PASSWORD"
          export NUVIO_KEY_ALIAS="$RELEASE_KEY_ALIAS"
          export NUVIO_KEY_PASS="$RELEASE_KEY_PASSWORD"
          export CERT_SHA256="skip"
          chmod +x android/gradlew
          bash tools/android.sh --release-only

      - name: Archive Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/android/Nuvio-*-android.apk

  build-tizen:
    if: false
    name: Build Samsung Tizen Packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install System Utilities (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Install Tizen Workload
        run: |
          DOTNET_DIR="$(dirname "$(which dotnet)")"
          echo "Installing Samsung Tizen Workload into $DOTNET_DIR"
          curl -sSL https://raw.githubusercontent.com/Samsung/Tizen.NET/main/workload/scripts/workload-install.sh -o /tmp/workload-install.sh
          sudo env "PATH=$PATH" "XDG_RUNTIME_DIR=/tmp" bash /tmp/workload-install.sh -d "$DOTNET_DIR" -u || true
          sudo rm -rf /run/user/$(id -u)/.dotnet 2>/dev/null || true
          sudo chown -R $(id -u):$(id -g) /run/user/$(id -u) "$HOME" "$DOTNET_DIR" 2>/dev/null || true
          dotnet workload list || true

      - name: Setup local.properties
        run: |
          cat <<EOF > local.properties
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
          TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login
          TMDB_API_KEY=01926d2187b6a5d861eefc750e9df3e3
          TRAKT_CLIENT_ID=5783db7c46a5b22f072d4b224f9bd7dc2cbaba66dbe3515d1feb59e3ca72394c
          TRAKT_CLIENT_SECRET=bf6e7561dafee902f5a2a67d2b31feac1563632f331f3958c978aff6389ea384
          SIMKL_CLIENT_ID=dc20e0db975583b15096267cee79cd23b1f56d4bd301ce3c51e4a96a49c834a6
          SIMKL_APP_NAME=nuvio
          NUVIO_REC_URL=https://nuvio-recomendacoes.henriquef29.workers.dev
          EOF

      - name: Build Tizen Packages
        run: |
          sudo rm -rf /run/user/$(id -u)/.dotnet 2>/dev/null || true
          sudo chown -R $(id -u):$(id -g) /run/user/$(id -u) "$HOME" 2>/dev/null || true
          if dotnet workload list 2>/dev/null | grep -q tizen; then
            bash tools/tpk.sh
          else
            NV_TPK_PACOTES="NuvioTpk40 NuvioTpk60 NuvioTpk65" bash tools/tpk.sh
          fi

      - name: Archive Tizen Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tizen-release-packages
          path: |
            build/tpk/*.tpk
            build/tpk/*.so

  publish-release:
    name: Publish Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: dist

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.5.3
          name: Nuvio Legacy 2.0.5.3 - Juansher v1.1.0
          draft: false
          prerelease: false
          files: |
            dist/*
          body: |
            ## Nuvio Legacy 2.0.5.3 - Juansher v1.1.0

            Actualizacion con rediseño completo de tarjetas de fuentes multilínea con iconos dedicados, resalte de audio en español/latino en verde esmeralda, selección automática condicionada estrictamente a ajustes, eliminación del marcado de debrid, y limpieza automática de residuos e instaladores post-actualización. Compatible con Android TV, Google TV y televisores Samsung (Tizen TPK / Web).

            ### Información de Versión y Plataformas
            - **Versión base oficial:** `2.0.5`
            - **Compilación técnica:** `2.0.5.3`
            - **Edición personalizada:** `Juansher v1.1.0`
            - **Plataformas soportadas:** Android TV, Google TV y Samsung Smart TV (Tizen).

            ### Cambios y Mejoras
            - **Rediseño multilínea organizado:** Cada especificación se muestra en su propia fila con iconos claros de interfaz (video, audio, uploader, tamaño/duración e idiomas).
            - **Píldora de estado de reproducción:** Muestra la insignia destacada 'Reproduciendo' en el extremo derecho de la fila del título cuando la fuente está activa.
            - **Resalte visual de audio en español y latino:** Detección y coloración diferenciada en verde esmeralda de pistas en español, latino y castellano.
            - **Supresión de indicador de Debrid:** Se eliminó por completo el marcado azul de debrid de la interfaz de fuentes.
            - **Selección automática condicionada:** La reproducción automática respeta de forma estricta el techo de resolución (ej. 1080p hacia abajo) y el idioma de audio configurado en Ajustes. Si ninguna fuente cumple ambos requisitos, se abre automáticamente el panel de fuentes.
            - **Enfoque inicial inteligente:** Al abrir el panel de fuentes, el cursor se posiciona sobre la mejor alternativa en español/resolución en lugar de situarse en la primera fila.
            - **Limpieza automática post-actualización:** Al arrancar por primera vez una versión nueva, un proceso en segundo plano elimina de forma quirúrgica los paquetes instaladores `.apk` viejos, archivos `.tmp` y caché temporal, protegiendo todos los datos de usuario y ahorrando valioso espacio de almacenamiento en la TV.
            - **Nota de distribución:** Compilación para Android TV / Google TV. Las compilaciones para Samsung Tizen se integran de forma continua.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
