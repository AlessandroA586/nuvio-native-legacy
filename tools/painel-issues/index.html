<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuvio Legacy - issues e roadmap</title>
<style>
:root{--bg:#0d0d0d;--card:#171717;--card2:#2c2c2c;--line:#303030;--tx:#f5f5f5;--mut:#b3b3b3;--ac:#e0ebff;--ac2:#38465c;--ok:#58c08a;--warn:#e0b24c;--bad:#e5736f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
header{padding:20px 16px 12px;border-bottom:1px solid var(--line)}
h1{margin:0 0 4px;font-size:20px;font-weight:650;display:flex;align-items:center;gap:10px}
h1 svg{width:22px;height:22px;color:var(--ac);flex:none}
.sub{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
main{max-width:1280px;margin:0 auto;padding:16px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:28px 0 10px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.kpi:hover,.kpi.on{border-color:var(--ac)}
.kpi b{display:block;font-size:26px;font-weight:650;line-height:1.1}
.kpi span{color:var(--mut);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 40px;gap:8px;align-items:center;width:100%;background:none;border:0;color:inherit;font:inherit;padding:4px 2px;border-radius:6px;cursor:pointer;text-align:left}
.bar:hover{background:var(--card2)}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ac2);border-radius:5px}
.bar.on .t i{background:var(--ac)}.bar.on .n{color:var(--ac);font-weight:600}
.bar .c{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.rel h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rel .sit{color:var(--mut);font-size:12px;margin:2px 0 6px}
.rel .desc{color:var(--mut);font-size:12.5px;margin:0 0 8px}
.it{border-top:1px solid var(--line);padding:8px 0}
.it b{display:block}
.it p{margin:3px 0;color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);margin:2px 3px 0 0;overflow-wrap:anywhere}
.tag.ac{color:var(--ac);border-color:var(--ac2)}.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.lst>div{border-top:1px solid var(--line);padding:9px 0}.lst>div:first-child{border-top:0}
.lst p{margin:3px 0;overflow-wrap:anywhere}.lst .rec{color:var(--mut)}
.q{font-style:normal}
.dec{border-top:1px solid var(--line);padding:10px 0}.lst>.dec:first-child{border-top:0}
.dec.feita{opacity:.65}
.resp{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.resp button{min-height:44px;min-width:96px;font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);cursor:pointer}
.resp button.on.sim{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.resp button.on.nao{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.resp button:focus-visible,.dec textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.dec textarea{width:100%;min-height:72px;resize:vertical;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.dec .linha{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.dec .env{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--ac);background:var(--ac2);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.dec .env[disabled]{opacity:.5;cursor:default}
.dec .ctr,.dec .est{color:var(--mut);font-size:12.5px}.dec .est.bad{color:var(--bad)}.dec .est.ok{color:var(--ok)}
.ctx{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:7px 0}
.ctx .rot{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px}
.ctx p{margin:3px 0}
.linha-issue{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;padding:3px 0;border-top:1px solid var(--line)}
.linha-issue:first-of-type{border-top:0}
.linha-issue .ti{overflow-wrap:anywhere;min-width:0}
.rot-l{color:var(--mut)}
.decidida{border-top:1px solid var(--line);padding:9px 0}.decidida:first-child{border-top:0}
.decidida .quando{color:var(--mut);font-size:12.5px}
.espera{color:var(--warn)}
.atualiz{color:var(--mut)}
.aviso{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12.5px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input,select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;min-width:0}
input[type=search]{flex:1 1 220px}
.chip{background:var(--card2);color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.chip.on{color:var(--bg);background:var(--ac);border-color:var(--ac)}
.btn{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.btn:hover{color:var(--tx);border-color:var(--ac)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:78vh;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--card2);cursor:pointer;white-space:nowrap;font-size:12px;color:var(--mut);user-select:none;z-index:1}
th.s{color:var(--ac)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--card)}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
td.tit{min-width:240px;overflow-wrap:anywhere}
tr.det td{background:var(--card);padding:12px 16px}
.det dl{margin:0;display:grid;grid-template-columns:130px 1fr;gap:6px 12px}
.det dt{color:var(--mut)}.det dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
@media(max-width:600px){.det dl{grid-template-columns:1fr}}
.cnt{color:var(--mut);font-size:12.5px;margin:6px 0}
.vazio{color:var(--mut);padding:8px 0}

/* Nuvio: layout.h background/focus/skeleton; gfx.c glass highlight (.88,.92,1).
   Interface family: src/text.c TXT_FAMILIA_INTER. Assets stay local. */
@font-face{font-family:Inter;src:url(fonts/InterDisplay-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/InterDisplay-Bold.ttf) format("truetype");font-weight:600 800;font-display:swap}
html{scroll-padding-top:20px}body{overflow-wrap:anywhere}
header{max-width:1280px;margin:auto;padding:24px 16px;display:flex;justify-content:space-between;align-items:center;gap:20px}
h1{font-size:25px;letter-spacing:-1px}header .sub{text-align:right}
nav{display:flex;gap:8px;flex-wrap:wrap}nav a,.cta{border:1px solid var(--line);border-radius:99px;padding:10px 18px;color:var(--tx);font-size:13px}
.hero{padding:40px 0 32px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.hero h2{font-size:clamp(34px,5vw,62px);line-height:1.04;letter-spacing:-.045em;text-transform:none;color:var(--tx);margin:12px 0 18px;font-weight:700;max-width:750px}
.hero p{color:var(--mut);max-width:550px;margin:0}.hero .cta{display:inline-block;margin-top:24px;background:var(--tx);color:var(--bg);font-weight:700}
.version{font-size:80px;font-weight:700;letter-spacing:-.07em;color:var(--ac);line-height:1}.version small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:14px;text-align:right}
h2{font-size:22px;letter-spacing:-.025em;text-transform:none;color:var(--tx);margin:36px 0 14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.release-grid,.help-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.release-column{min-width:0;border-top:2px solid var(--line);padding-top:16px}.release-column.current{border-color:var(--ac)}
.release-column h3{font-size:24px;margin:8px 0}.release-column .rel{margin-top:12px}
.rel{padding:20px;border-radius:18px}.rel h3{font-size:19px}.rel .desc{font-size:14px}
.issue-card{padding:14px 0;border-bottom:1px solid var(--line);min-width:0}.issue-card:last-child{border:0}.issue-card h4{font-size:15px;line-height:1.4;margin:7px 0;font-weight:600}
.issue-card p{color:var(--mut);font-size:13px;margin:8px 0}.issue-card .tag{font-size:11px}.issue-card details{margin-top:8px}
summary{cursor:pointer;min-height:44px;padding:10px 0;color:var(--ac);font-size:13px}summary:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.internal{border:1px solid var(--line);border-radius:14px;padding:4px 18px;margin:12px 0}.internal>summary{font-size:15px}.internal h2{font-size:18px}
.help-grid>.panel{padding:20px;border-radius:18px}.help-grid h3{margin:0;font-size:18px}.help-grid .cards{display:block}
.section-note{color:var(--mut);font-size:13px;margin:-6px 0 18px}.kpis{margin-bottom:24px}.kpi{border-radius:16px}
.scroll{max-height:none;overflow:visible}table{min-width:0;table-layout:fixed;font-size:12px}td.tit{min-width:0}th{white-space:normal}td,th{overflow-wrap:anywhere}
@media(max-width:800px){.release-grid,.help-grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.version{display:none}header{align-items:flex-start}nav a{padding:8px 12px}.hero{padding-top:24px}table,tbody,tr,td{display:block;width:100%}thead{display:none}td:empty{display:none}td{border:0;padding:3px 12px}td[data-label]:before{content:attr(data-label) " · ";color:var(--mut)}tr{padding:12px 0;border-bottom:1px solid var(--line)}th{position:static}table tr:has(th){display:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.tag{max-width:100%}select{max-width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><h1><svg aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z" />
  <path d="M15 5.764v15" />
  <path d="M9 3.236v15" />
</svg>
<span>Nuvio<span class="sub"> / Legacy</span></span></h1>
<nav aria-label="Navegação"><a href="#roadmap">Roadmap</a><a href="#ajudar">Como ajudar</a><a href="#tabela">Issues</a></nav></header>
<main id="app"></main>
<script>
"use strict";
function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "text") e.textContent = attrs[k];
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function safeUrl(u) { return /^https?:\/\//.test(u || "") ? u : null; }
function sv(v) { return v == null || v === "" ? "" : String(v); }

var D, ITENS, BY = {}, F = { q: "", plat: "", status: "", alvo: "", estado: "", extra: "", sort: "numero", dir: -1 };
var RASCUNHOS = {};   // o que o dono esta digitando, por id: sobrevive ao recarregamento
var ULTIMA = Date.now(), ASSINATURA = "";
var ALVO_ORDEM = ["2.0.4", "2.0.5", "2.1", "2.2", "futuro", "nao vamos fazer", "ja-lancada"];
var SEM_ALVO = "(sem alvo)";

function alvoDe(i) { return i.alvo ? String(i.alvo) : SEM_ALVO; }
function platDe(i) {
  var p = sv(i.plataforma);
  if (!p || p === "?") return "desconhecida";
  if (/^samsung/i.test(p)) return "Samsung";
  if (/^lg/i.test(p)) return "LG";
  if (/^android/i.test(p)) return "Android";
  if (p === "all") return "todas";
  return "outras";
}
function aberta(i) { return i.estado_github === "aberta"; }
function proximaVersao() { return "2.0.5"; }
function sortAlvos(keys) {
  return keys.sort(function (a, b) {
    var ia = ALVO_ORDEM.indexOf(a), ib = ALVO_ORDEM.indexOf(b);
    if (a === SEM_ALVO) ia = 99; if (b === SEM_ALVO) ib = 99;
    if (ia < 0) ia = 50; if (ib < 0) ib = 50;
    return ia - ib || a.localeCompare(b);
  });
}
function count(fn) {
  var m = {};
  ITENS.forEach(function (i) { var k = fn(i); m[k] = (m[k] || 0) + 1; });
  return m;
}

function issueUrl(n) {
  var it = BY[n], u = it && safeUrl(it.url);
  if (u) return u;
  var repo = (D && D.meta && D.meta.repo) || "";
  return repo ? repo + "/issues/" + n : null;
}
function issueLink(n) {
  var it = BY[n], u = issueUrl(n), t = "#" + n;
  return u ? el("a", { href: u, target: "_blank", rel: "noopener", text: t, title: (it && it.titulo) || "" }) : el("span", { text: t });
}

// O mapa tem texto de terceiros: linkify monta NODES, nunca innerHTML.
// #NNN vira issue/PR, hash que existe no repo (meta.commits) vira commit,
// branch citada (meta.branches) vira tree, e URL http(s) vira link.
var RE_LINK = /https?:\/\/[^\s<>"'`]+|#\d{1,4}\b|\b[0-9a-f]{7,12}\b|[A-Za-z0-9][A-Za-z0-9._-]*\/[A-Za-z0-9][A-Za-z0-9._/-]*/g;
function linkify(texto) {
  var frag = document.createDocumentFragment(), t = sv(texto);
  if (!t) return frag;
  var meta = (D && D.meta) || {}, repo = meta.repo || "", commits = meta.commits || {}, branches = {};
  (meta.branches || []).forEach(function (b) { branches[b] = 1; });
  var last = 0, m, re = new RegExp(RE_LINK.source, "g");
  while ((m = re.exec(t)) !== null) {
    var txt = m[0], url = null;
    if (/^https?:/i.test(txt)) {
      while (txt.length > 10 && /[.,;:!?)\]]$/.test(txt)) txt = txt.slice(0, -1);
      url = safeUrl(txt);
    } else if (txt.charAt(0) === "#") {
      url = issueUrl(Number(txt.slice(1)));
    } else if (branches[txt] && repo) {
      url = repo + "/tree/" + txt;
    } else if (commits[txt] && repo) {
      url = repo + "/commit/" + commits[txt];
    }
    if (!url) continue;
    frag.appendChild(document.createTextNode(t.slice(last, m.index)));
    frag.appendChild(el("a", { href: url, target: "_blank", rel: "noopener", text: txt, title: txt }));
    last = m.index + txt.length;
  }
  frag.appendChild(document.createTextNode(t.slice(last)));
  return frag;
}
function tx(texto, tag, cls) { var e = el(tag || "span", cls ? { class: cls } : null); e.appendChild(linkify(texto)); return e; }

function setFilter(k, v) {
  F[k] = (F[k] === v) ? "" : v;
  renderBars(); renderTools(); renderTable();
  document.getElementById("tabela").scrollIntoView({ behavior: "smooth", block: "start" });
}

function kpi(label, val, onclick, key) {
  return el("button", { class: "kpi" + (F.extra === key && key ? " on" : ""), onclick: onclick, type: "button" }, [el("b", { text: String(val) }), el("span", { text: label })]);
}

function renderKpis() {
  var box = document.getElementById("kpis"); box.textContent = "";
  var prox = proximaVersao();
  var abertas = ITENS.filter(aberta);
  var saiProx = abertas.filter(function (i) { return i.alvo === prox; }).length;
  var semResp = abertas.filter(function (i) { return i.ultima_resposta && i.ultima_resposta.nos === false; }).length;
  var log = ITENS.filter(function (i) { return i.status === "precisa-log"; }).length;
  var ex = function (k, estado) { return function () { F.extra = k; F.estado = estado || ""; F.alvo = ""; F.status = ""; F.plat = ""; F.q = ""; renderAll(); document.getElementById("tabela").scrollIntoView({ behavior: "smooth" }); }; };
  box.appendChild(kpi("total de issues", ITENS.length, ex(""), ""));
  box.appendChild(kpi("abertas no GitHub", abertas.length, ex("", "aberta"), "ab"));
  box.appendChild(kpi("no escopo da release (" + prox + ")", saiProx, function () { F.extra = ""; F.estado = "aberta"; F.alvo = prox; F.status = ""; F.plat = ""; F.q = ""; renderAll(); document.getElementById("tabela").scrollIntoView({ behavior: "smooth" }); }, "px"));
  box.appendChild(kpi("sem resposta nossa", semResp, ex("semresp", "aberta"), "semresp"));
  box.appendChild(kpi("aguardando log", log, function () { F.extra = ""; F.estado = ""; F.alvo = ""; F.status = "precisa-log"; F.plat = ""; F.q = ""; renderAll(); document.getElementById("tabela").scrollIntoView({ behavior: "smooth" }); }, "log"));
}

function barBlock(titulo, map, keys, campo) {
  var max = Math.max.apply(null, keys.map(function (k) { return map[k]; }).concat([1]));
  var p = el("div", { class: "panel" }, [el("div", { class: "sub", text: titulo })]);
  keys.forEach(function (k) {
    p.appendChild(el("button", { class: "bar" + (F[campo] === k ? " on" : ""), type: "button", onclick: function () { setFilter(campo, k); } }, [
      el("span", { class: "n", text: k, title: k }),
      el("span", { class: "t" }, [el("i", { style: "width:" + Math.round(map[k] / max * 100) + "%" })]),
      el("span", { class: "c", text: String(map[k]) })
    ]));
  });
  return p;
}
function renderBars() {
  var box = document.getElementById("bars"); box.textContent = "";
  var ma = count(alvoDe), ms = count(function (i) { return sv(i.status) || "(sem status)"; });
  var ks = Object.keys(ms).sort(function (a, b) { return ms[b] - ms[a]; });
  box.appendChild(barBlock("Por alvo (release)", ma, sortAlvos(Object.keys(ma)), "alvo"));
  box.appendChild(barBlock("Por status", ms, ks, "status"));
}

// Conservative presentation: closed is not shipped, a commit is not device proof.
function estadoPublico(i) {
  if (i.status === "lancada") return ["Concluído", "ok"];
  if (i.status === "consertada-nao-lancada" || /^(precisa-teste|aguardando-teste)$/.test(i.status)) return ["Precisa testar", "warn"];
  if (/^(bloqueada|bloqueado|precisa-log)$/.test(i.status)) return ["Bloqueado", "bad"];
  if (/^(em-andamento|em-progresso)$/.test(i.status)) return ["Em andamento", "ac"];
  return ["Planejado", ""];
}
function referencias(i) {
  var texto = [i.notas, i.proximo_passo].concat(i.conserto || []).join(" ");
  var tokens = texto.match(RE_LINK) || [], m = D.meta || {};
  return { branches: (m.branches || []).filter(function (b) { return tokens.indexOf(b) >= 0; }),
    commits: Object.keys(m.commits || {}).filter(function (h) { return tokens.indexOf(h) >= 0; }) };
}
function issueCard(i, contexto) {
  var st = estadoPublico(i), d = el("article", { class: "issue-card" }, [
    el("div", null, [issueLink(i.numero), el("span", { class: "tag", text: i.plataforma || "Plataforma não informada" }), el("span", { class: "tag " + st[1], text: st[0] })]),
    tx(i.titulo, "h4")]);
  if (contexto) d.appendChild(el("p", { text: contexto }));
  if (i.proximo_passo && i.proximo_passo !== "triar") d.appendChild(tx(i.proximo_passo, "p"));
  if (i.notas) d.appendChild(el("details", { "data-preserve": "issue-" + i.numero }, [el("summary", { text: "Contexto e evidências" }), tx(i.notas, "p")]));
  return d;
}

    ]);
    row.children && Array.prototype.forEach.call(row.children, function (td, n) { td.setAttribute("data-label", COLS[n][1]); });
    tb.appendChild(row);
    var det = null;

}

// AUDITORIA: quem validou o que, em que ref, com que resultado e onde esta a

var RES_TAG = { passou: "ok", falhou: "bad", inconclusivo: "warn", "nao-reproduziu": "warn", pendente: "" };

  var t = el("table");

    t.appendChild(el("tr", null, [

function renderFora() {

function esqueleto() {
  var app = document.getElementById("app");
  app.textContent = "";
  function sec(titulo, id, cls) { app.appendChild(el("h2", { text: titulo })); var b = el("div", { id: id, class: cls || "" }); app.appendChild(b); return b; }
  app.appendChild(el("section", { class: "hero" }, [el("div", null, [el("div", { class: "eyebrow", text: "Desenvolvimento aberto / Nuvio Legacy" }), el("h2", { text: "O próximo capítulo. Feito com você." }), el("p", { text: "Acompanhe as entregas, entenda o que vem a seguir e ajude a melhorar a experiência na sua TV." }), el("a", { href: "#ajudar", class: "cta", text: "Quero ajudar" })]), el("div", { class: "version", text: "2.0.5" }, [el("small", { text: "Release em integração" })])]));

  function interno(titulo, id, cls) { var d = el("details", { class: "internal" }, [el("summary", { text: "Interno · " + titulo }), el("div", { id: id, class: cls || "" })]); app.appendChild(d); }

}
function meta() {

function aplicaDados(d) {

  ITENS.forEach(function (i) { BY[i.numero] = i; });

  return carregaRespostas().then(renderDecisoes);
}
function init(d) { ASSINATURA = JSON.stringify(d); esqueleto(); return aplicaDados(d); }

// Recarrega sem perder o que o dono esta digitando nem o scroll.
// fn pode devolver promise: a restauracao so acontece depois do redesenho
// assincrono dos cartoes de decisao.
var EV = "scroll wheel click keydown input touchstart";
function preserva(fn) {
  var expandidos = [].slice.call(document.querySelectorAll("details[data-preserve]")).filter(function (d) { return d.open; }).map(function (d) { return d.getAttribute("data-preserve"); });
  var y = window.pageYOffset || document.documentElement.scrollTop || 0;
  var caixas = [].slice.call(document.querySelectorAll(".scroll")).map(function (c) { return [c.id, c.scrollTop]; });
  var a = document.activeElement;
  var id = a && a.tagName === "TEXTAREA" ? a.getAttribute("data-dec") : null;
  var pos = a && a.selectionStart;
  var mexidos = false, ouve = function () { mexidos = true; };
  EV.split(" ").forEach(function (ev) { window.addEventListener(ev, ouve, true); });
  var solta = function () { EV.split(" ").forEach(function (ev) { window.removeEventListener(ev, ouve, true); }); };
  return Promise.resolve(fn()).then(function () {
    solta();
    [].slice.call(document.querySelectorAll("details[data-preserve]")).forEach(function (d) { d.open = expandidos.indexOf(d.getAttribute("data-preserve")) >= 0; });
    if (mexidos) return;   // o dono mexeu durante a espera: nao rouba o foco nem o scroll
    // foco primeiro e sem rolar: senao o foco puxa a pagina para o textarea
    if (id) {
      var t = document.querySelector('textarea[data-dec="' + id.replace(/"/g, "") + '"]');
      if (t) {
        try { t.focus({ preventScroll: true }); } catch (e) { t.focus(); }
        try { t.setSelectionRange(pos, pos); } catch (e) { /* sem cursor */ }
      }
    }
    caixas.forEach(function (p) {
      var c = document.getElementById(p[0]);
      if (c) c.scrollTop = p[1];
    });
    window.scrollTo(0, y);
  }, function (e) { solta(); throw e; });
}
function relogio() {
  var s = Math.max(0, Math.round((Date.now() - ULTIMA) / 1000)), m = Math.floor(s / 60);
  document.getElementById("atualiz").textContent = m > 0 ? "atualizado há " + m + " min" : "atualizado há " + s + " s";
}
function buscaMapa() {
  return fetch("data.json", { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}
function recarrega() {
  return preserva(function () {
    return buscaMapa().then(function (d) {
      if (JSON.stringify(d) !== ASSINATURA) { ASSINATURA = JSON.stringify(d); return aplicaDados(d); }
      // mapa igual, mas as respostas podem ter vindo de outra aba (ou a API ter voltado)
      return carregaRespostas().then(renderDecisoes);
    });
  }).then(function () {
    ULTIMA = Date.now(); relogio();
  }).catch(function (e) {
    ULTIMA = Date.now(); relogio();
    var av = document.getElementById("falha");
    if (av) { av.textContent = "ultima recarga falhou: " + e.message; av.hidden = false; }
  });
}
function ligaRelogio() {
  relogio();
  setInterval(relogio, 1000);
  setInterval(recarrega, 30000);   // tempo real: data.json + /api/respostas a cada 30 s
}
buscaMapa().then(init).then(ligaRelogio).catch(function (e) {
  document.getElementById("meta").textContent = "Erro ao carregar data.json: " + e.message + " (rode gerar.py e sirva a pasta site/ por HTTP)";
});
</script>
