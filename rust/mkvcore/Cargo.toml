[package]
name = "mkvcore"
version = "0.1.0"
edition = "2021"
publish = false
description = "EBML/NAL core of src/mkv.c (phase 1 Rust pilot, docs/plans/rust-mapa.md). Off by default: -DNV_RUST_MKVCORE."

# Standalone: never picked up as a member of another workspace.
[workspace]

[lib]
crate-type = ["staticlib"]

# A panic must never cross the FFI boundary: abort in every profile. The size
# flags matter because the Android/TV links are size-sensitive.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = false
